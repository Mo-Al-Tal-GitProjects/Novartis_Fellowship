[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cipher"
version = "0.1.0"
description = "Histopathology embedding retrieval research pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Mohammed Khodor Firas Al-Tal"},
]
dependencies = [
  "click>=8.1,<9",
  "httpx>=0.27,<1",
  "huggingface-hub>=0.27,<1",
  "matplotlib>=3.9,<4",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "Pillow>=10,<13",
  "pyarrow>=17",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "safetensors>=0.4,<1",
  "timm>=1,<2",
  "torch>=2.5,<3",
  "torchvision>=0.20,<1",
  "transformers>=4.47,<5",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
cipher = "cipher.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
